<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" preserveAspectRatio="none">
  <!-- Rückseite aller Karten: Papierrand, grüner Grund mit Rautenmuster, feine Innenlinie -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6ea64b"/>
      <stop offset="1" stop-color="#3f7a2a"/>
    </linearGradient>
    <pattern id="links" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="11" fill="#fbf5e6" fill-opacity="0.16"/>
    </pattern>
    <pattern id="rechts" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="4" height="11" fill="#fbf5e6" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="100" height="140" rx="8" fill="#fbf5e6"/>
  <rect x="5" y="5" width="90" height="130" rx="5" fill="url(#grund)"/>
  <rect x="5" y="5" width="90" height="130" rx="5" fill="url(#links)"/>
  <rect x="5" y="5" width="90" height="130" rx="5" fill="url(#rechts)"/>
  <rect x="13" y="13" width="74" height="114" rx="4" fill="none" stroke="#fbf5e6" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>

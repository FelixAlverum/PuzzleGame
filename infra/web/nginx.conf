server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Einstieg, Service Worker und Manifest immer frisch holen, damit ein neuer Build sofort ankommt
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Von Vite gebaute Dateien tragen einen Hash im Namen und ändern sich nie
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

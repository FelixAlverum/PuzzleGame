server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    # Spielcode nicht aggressiv cachen, solange es ein Prototyp ist
    location /src/ {
        add_header Cache-Control "no-cache";
    }
}

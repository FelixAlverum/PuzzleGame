<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PuzzleGame Prototype</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 28C4 12 14 4 28 4C28 18 20 28 4 28Z' fill='%235fa548'/%3E%3Cpath d='M4 28L22 10' stroke='%23e8f5d0' stroke-width='2'/%3E%3C/svg%3E">
  <!-- YouTube Playables SDK: muss vor jedem Spielcode geladen werden (läuft lokal als No-op bzw. fehlt offline) -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <style>
    :root {
      --paper: #fbf5e6; --paper-2: #f3ead2; --wood: #a8743f; --ink: #4a3424; --ink-soft: rgba(80,60,35,0.8);
      --green: #5d9a3e; --green-dark: #3f7a2a; --red: #b8452f; --shadow: rgba(40,25,10,0.28);
      --font: "Trebuchet MS", "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #efe6cf;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; touch-action: none; }
    #game { width: 100%; height: 100%; }

    /* Menü-Overlay: scrollt bei wenig Platz (Playables: 9:32 bis 32:9 muss gehen) */
    #ui {
      position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
      display: flex; justify-content: center; align-items: safe center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      box-sizing: border-box;
      background: rgba(239,230,207,0.45);
      font-family: var(--font); color: var(--ink);
    }
    #ui[hidden] { display: none; }
    .screen { display: none; flex-direction: column; gap: 14px; width: min(100%, 1000px); }
    .screen.active { display: flex; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand h1 { margin: 0; font-size: clamp(26px, 5vw, 42px); font-weight: 800; color: #3d5a2a; line-height: 1;
      text-shadow: 0 2px 0 rgba(255,250,235,0.9); }
    .brand p { margin: 4px 0 0; font-weight: 700; color: var(--ink-soft); }
    h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }

    .card { background: var(--paper); border: 2px solid var(--wood); border-radius: 16px; padding: 12px;
      box-shadow: 0 4px 0 var(--shadow); box-sizing: border-box; min-width: 0; }
    .biomes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
    .biome { display: flex; flex-direction: column; gap: 4px; }
    .thumb { width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; margin-bottom: 6px; background: var(--paper-2); touch-action: pan-y; }
    .desc { margin: 0; color: var(--ink-soft); font-size: 14px; }
    .meta { margin: 2px 0 6px; display: flex; gap: 14px; font-weight: 700; font-size: 14px; color: var(--green-dark); }
    .actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .actions .primary { flex: 1 1 auto; }

    button { font-family: var(--font); }
    .pill { border: 2px solid transparent; border-radius: 999px; padding: 10px 18px; min-height: 44px;
      font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 var(--shadow); color: var(--ink); background: var(--paper); }
    .pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
    .pill.primary { background: var(--green); color: #fff; }
    .pill.ghost { border-color: var(--wood); }
    .pill.small { font-size: 14px; padding: 8px 14px; }
    .pill.danger, .pill.armed { background: var(--red); color: #fff; border-color: var(--red); }
    button:focus-visible, input:focus-visible { outline: 3px solid #e8b04a; outline-offset: 2px; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .tile { background: var(--paper-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; }
    .tile .num { font-size: 26px; font-weight: 800; color: #2f5d2a; }
    .tile .lbl { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
    .stats-grid > .card:first-child { grid-column: 1 / -1; }
    table.stats { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    table.stats th, table.stats td { padding: 6px 4px; text-align: right; border-bottom: 1px solid rgba(168,116,63,0.25); }
    table.stats th:first-child { text-align: left; }
    table.stats thead th { font-size: 12px; color: var(--ink-soft); }
    table.stats tr.sum th, table.stats tr.sum td { font-weight: 800; border-bottom: none; }

    .setting { display: grid; grid-template-columns: minmax(110px, 160px) 1fr 52px; align-items: center; gap: 12px; padding: 8px 0; font-weight: 700; }
    .setting output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
    input[type=range] { width: 100%; accent-color: var(--green); min-height: 32px; touch-action: pan-x; }
    .seg-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .seg { flex: 1 1 80px; min-height: 44px; border-radius: 12px; border: 2px solid var(--wood); background: var(--paper);
      font-size: 16px; font-weight: 800; color: var(--ink); cursor: pointer; }
    .seg.on { background: var(--green); border-color: var(--green); color: #fff; }
    .note { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); }
    .seg.lang { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .flag { display: inline-flex; width: 30px; height: 20px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); flex: none; }
    .flag svg { width: 100%; height: 100%; display: block; }

    .guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
    .guide > .full { grid-column: 1 / -1; }
    .guide p { margin: 6px 0; line-height: 1.45; }
    .guide-list { margin: 0; padding-left: 20px; line-height: 1.45; }
    .guide-list li { margin: 4px 0; }
    table.points { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
    table.points th { text-align: left; font-weight: 700; padding: 6px 4px; border-bottom: 1px solid rgba(168,116,63,0.25); }
    table.points td { text-align: right; font-weight: 800; color: #2f5d2a; padding: 6px 4px; border-bottom: 1px solid rgba(168,116,63,0.25); font-variant-numeric: tabular-nums; }
    .example { background: var(--paper-2); border-radius: 10px; padding: 8px 10px; font-weight: 700; }
    .guide-biomes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 8px; }
    .guide-biome h3 { margin: 2px 0; font-size: 18px; }
    .thumb.wide { aspect-ratio: 3 / 1; }

    @media (max-width: 600px) { .thumb { aspect-ratio: 5 / 2; } }
    @media (max-height: 480px) { .thumb { aspect-ratio: 3 / 1; } .brand h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui" hidden>
    <section class="screen" id="screen-menu" aria-labelledby="menu-title">
      <div class="top">
        <div class="brand"><h1 id="menu-title" data-t="title"></h1><p data-t="choose"></p></div>
        <div class="row">
          <button class="pill ghost small" id="size-chip" data-go="settings"></button>
          <button class="pill ghost" data-go="guide" data-t="guide"></button>
          <button class="pill ghost" data-go="stats" data-t="stats"></button>
          <button class="pill ghost" data-go="settings" data-t="settings"></button>
        </div>
      </div>
      <div class="biomes" id="biomes"></div>
    </section>

    <section class="screen" id="screen-guide" aria-labelledby="guide-title">
      <div class="top">
        <div class="brand"><h1 id="guide-title" data-t="guide"></h1></div>
        <button class="pill ghost" data-go="menu" data-t="back"></button>
      </div>
      <div class="guide" id="guide-body"></div>
      <div class="row"><button class="pill primary" data-go="menu" data-t="back"></button></div>
    </section>

    <section class="screen" id="screen-stats" aria-labelledby="stats-title">
      <div class="top">
        <div class="brand"><h1 id="stats-title" data-t="stats"></h1></div>
        <button class="pill ghost" data-go="menu" data-t="back"></button>
      </div>
      <div class="stats-grid" id="stats-body"></div>
      <div class="row"><button class="pill ghost small" id="reset-stats" data-t="resetStats"></button></div>
    </section>

    <section class="screen" id="screen-settings" aria-labelledby="settings-title">
      <div class="top">
        <div class="brand"><h1 id="settings-title" data-t="settings"></h1></div>
        <button class="pill ghost" data-go="menu" data-t="back"></button>
      </div>
      <div class="card">
        <h2 data-t="sound"></h2>
        <label class="setting"><span data-t="music"></span><input type="range" id="vol-music" min="0" max="100" step="5"><output id="val-music"></output></label>
        <label class="setting"><span data-t="sfx"></span><input type="range" id="vol-sfx" min="0" max="100" step="5"><output id="val-sfx"></output></label>
        <label class="setting"><span data-t="amb"></span><input type="range" id="vol-amb" min="0" max="100" step="5"><output id="val-amb"></output></label>
        <p class="note" id="muted-note" data-t="muted" hidden></p>
      </div>
      <div class="card">
        <h2 data-t="fieldSize"></h2>
        <div class="seg-row" id="size-seg" role="radiogroup"></div>
        <p class="note" data-t="sizeNote"></p>
      </div>
      <div class="card">
        <h2 data-t="language"></h2>
        <div class="seg-row" id="lang-seg" role="radiogroup"></div>
      </div>
    </section>
  </div>

  <script src="src/yt.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/shapes.js"></script>
  <script src="src/logic.js"></script>
  <script src="src/materials.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/garden.js"></script>
  <script src="src/menu.js"></script>
  <script src="src/main.js"></script>
</body>
</html>

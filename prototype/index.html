<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PuzzleGame Prototype</title>
  <!-- YouTube Playables SDK: muss vor jedem Spielcode geladen werden (läuft lokal als No-op bzw. fehlt offline) -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #efe6cf;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="src/yt.js"></script>
  <script src="src/shapes.js"></script>
  <script src="src/logic.js"></script>
  <script src="src/materials.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/garden.js"></script>
  <script src="src/main.js"></script>
</body>
</html>

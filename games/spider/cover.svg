<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efd9"/>
      <stop offset="1" stop-color="#e6dbbd"/>
    </linearGradient>
    <radialGradient id="felt" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#76ad59"/>
      <stop offset="1" stop-color="#4f8a3a"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffcf3"/>
      <stop offset="1" stop-color="#f8eed8"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea64b"/>
      <stop offset="1" stop-color="#3f7a2a"/>
    </linearGradient>
    <path id="spade" d="M12 1.5C9.2 5.6 3.5 8.6 3.5 13.4a4.3 4.3 0 0 0 7.4 3L9.8 22h4.4l-1.1-5.6a4.3 4.3 0 0 0 7.4-3C20.5 8.6 14.8 5.6 12 1.5z"/>
    <g id="b">
      <rect width="30" height="42" rx="3" fill="#fbf5e6"/>
      <rect x="2" y="2" width="26" height="38" rx="2" fill="url(#back)"/>
    </g>
    <g id="f">
      <rect width="30" height="42" rx="3" fill="url(#face)" stroke="#4a3424" stroke-opacity="0.4"/>
    </g>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect x="14" y="12" width="292" height="156" rx="14" fill="#a8743f"/>
  <rect x="19" y="17" width="282" height="146" rx="10" fill="url(#felt)"/>

  <!-- Spalten mit absteigenden Pik-Folgen -->
  <g font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" font-size="11" fill="#2b2420">
    <g transform="translate(30 28)">
      <use href="#b"/><use href="#b" y="8"/>
      <use href="#f" y="16"/><text x="4" y="27">K</text><use href="#spade" transform="translate(17 19) scale(0.42)"/>
      <use href="#f" y="30"/><text x="4" y="41">Q</text><use href="#spade" transform="translate(17 33) scale(0.42)"/>
      <use href="#f" y="44"/><text x="4" y="55">J</text><use href="#spade" transform="translate(17 47) scale(0.42)"/>
      <use href="#f" y="58"/><text x="3" y="69">10</text><use href="#spade" transform="translate(17 61) scale(0.42)"/>
      <use href="#spade" transform="translate(8 76) scale(0.6)"/>
    </g>
    <g transform="translate(66 28)">
      <use href="#b"/><use href="#b" y="8"/><use href="#b" y="16"/>
      <use href="#f" y="24"/><text x="4" y="35">9</text><use href="#spade" transform="translate(17 27) scale(0.42)"/>
      <use href="#f" y="38"/><text x="4" y="49">8</text><use href="#spade" transform="translate(17 41) scale(0.42)"/>
      <use href="#spade" transform="translate(8 56) scale(0.6)"/>
    </g>
    <g transform="translate(102 28)">
      <use href="#b"/><use href="#b" y="8"/>
      <use href="#f" y="16"/><text x="4" y="27">7</text><use href="#spade" transform="translate(17 19) scale(0.42)"/>
      <use href="#f" y="30"/><text x="4" y="41">6</text><use href="#spade" transform="translate(17 33) scale(0.42)"/>
      <use href="#f" y="44"/><text x="4" y="55">5</text><use href="#spade" transform="translate(17 47) scale(0.42)"/>
      <use href="#spade" transform="translate(8 62) scale(0.6)"/>
    </g>
    <g transform="translate(138 28)">
      <use href="#b"/><use href="#b" y="8"/><use href="#b" y="16"/><use href="#b" y="24"/>
      <use href="#f" y="32"/><text x="4" y="43">4</text><use href="#spade" transform="translate(17 35) scale(0.42)"/>
      <use href="#spade" transform="translate(8 50) scale(0.6)"/>
    </g>
  </g>

  <!-- Spinne am Faden -->
  <g transform="translate(236 0)">
    <path d="M0 17V70" stroke="#fbf5e6" stroke-opacity="0.75" stroke-width="1.5"/>
    <g transform="translate(0 92)" stroke="#3a2a1c" stroke-width="3.2" fill="none" stroke-linecap="round">
      <path d="M-8 -6C-18 -16 -24 -14 -30 -24M-9 -1C-22 -4 -28 0 -36 -6M-9 4C-20 8 -26 16 -32 18M-7 9C-14 18 -16 26 -22 32"/>
      <path d="M8 -6C18 -16 24 -14 30 -24M9 -1C22 -4 28 0 36 -6M9 4C20 8 26 16 32 18M7 9C14 18 16 26 22 32"/>
    </g>
    <ellipse cx="0" cy="96" rx="11" ry="14" fill="#3a2a1c"/>
    <circle cx="0" cy="77" r="8" fill="#3a2a1c"/>
    <circle cx="-3" cy="75" r="1.8" fill="#fbf5e6"/>
    <circle cx="3" cy="75" r="1.8" fill="#fbf5e6"/>
    <path d="M-4 92h8M-5 98h10" stroke="#a8743f" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Fertige Folge unten rechts: König obenauf -->
  <g transform="translate(262 112)" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" font-size="11" fill="#2b2420">
    <use href="#f" x="-6" y="0"/><use href="#f" x="-3" y="0"/>
    <use href="#f" x="0" y="0"/><text x="4" y="12">K</text><use href="#spade" transform="translate(8 16) scale(0.6)"/>
  </g>
